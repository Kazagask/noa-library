manifestVersion: 1
id: demo
title: 苍岚书院
genre: 低奇幻 · 学院 · 悬疑
worldlineDefault: wl-main
sourceLayers:
  canonical:
    authority: immutable
    description: 原作事实；本示例世界为原创，无外部原作可覆盖。
    files:
      - lore.md
  template:
    authority: template
    description: 模板设定，可被当前世界线覆盖，但不得回写污染 canonical。
    files:
      - characters.yaml
      - rules.yaml
  worldline:
    authority: runtime-authoritative
    description: 当前世界线实际事实；以 campaign state 与 active fact 关系为准。
    files:
      - ../../campaigns/demo/state/latest.json
      - ../../campaigns/demo/memory/relations.jsonl
  subjective:
    authority: none
    description: NPC 主观认知；仅对 holder 可见，永不作为客观事实。
    files:
      - ../../campaigns/demo/memory/relations.jsonl#epistemic=belief
overridePolicy:
  - 当前世界线事实可以覆盖模板设定，但不能修改 lore.md 中的原作事实。
  - 回档只恢复本世界线；不得把未来世界线的情报带入过去。
  - worlds/ 是知识库，campaigns/ 是存档；两者不隐式同步。
gmProfile: gm.yaml
entry: lore.md
